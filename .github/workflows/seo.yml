# После правки games.js пересобирает разметку для поисковиков в index.html
# и sitemap.xml (tools/seo.py), чтобы не забыть запустить его руками.
name: Разметка для поисковиков

on:
  push:
    paths:
      - docs/games.js
      - tools/seo.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Разметка
        run: python3 tools/seo.py
      - name: Сохранить
        run: |
          git diff --quiet docs/index.html docs/sitemap.xml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/sitemap.xml
          git commit -m "Разметка для поисковиков"
          git push
