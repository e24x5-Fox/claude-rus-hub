# Раз в шесть часов обновляет список донатеров в docs/donors.js.
# Ключ DonationAlerts — в секрете DA_TOKEN (tools/donors_token.py).
name: Список донатеров

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  donors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Список
        env:
          DA_TOKEN: ${{ secrets.DA_TOKEN }}
        run: python3 tools/donors_snapshot.py
      - name: Сохранить
        run: |
          git diff --quiet docs/donors.js && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add docs/donors.js
          git commit -m "Список донатеров $(date -u +%F)"
          git pull --rebase
          git push
