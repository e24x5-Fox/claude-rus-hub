# Раз в сутки записывает счёт скачиваний каждой игры в docs/downloads.js:
# у GitHub нет истории скачиваний, а каталогу нужно «популярное за неделю».
# Там же — текущая сборка игр в Steam в docs/builds.js (плашка версии игры)
# и объявление рубежа скачиваний в Discord (секрет DISCORD_BAKERY_WEBHOOK).
name: Снимок скачиваний

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Снимок
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/downloads_snapshot.py
      - name: Сборки игр в Steam
        run: python3 tools/builds_snapshot.py
      # прошли новую степень двойки — «Лисья мастерская» объявляет в #булочной
      # (tools/milestone_post.py, фраза — из THANKS в docs/side.js)
      - name: Рубеж скачиваний
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_BAKERY_WEBHOOK: ${{ secrets.DISCORD_BAKERY_WEBHOOK }}
        run: python3 tools/milestone_post.py || echo "рубеж не объявлен — снимок сохраняем всё равно"
      - name: Сохранить
        run: |
          git diff --quiet docs/downloads.js docs/builds.js tools/milestones_state.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads.js docs/builds.js tools/milestones_state.json
          git commit -m "Снимок скачиваний $(date -u +%F)"
          git push
